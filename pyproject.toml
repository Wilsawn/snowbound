[project]
name = "snowbound"
version = "0.1.0"
description = "Reproduce U of T's lidar localization result in a Toronto snowstorm, then stress test it."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "matplotlib",
    "rerun-sdk",
    "open3d",
    "kiss-icp",
    "evo",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowbound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
